version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: logitruck_postgres
    environment:
      POSTGRES_DB: logitruck_db
      POSTGRES_USER: logitruck_user
      POSTGRES_PASSWORD: logitruck_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: logitruck_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: logitruck_adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
