# render.yaml — Déploiement LogiTruck sur Render (plan gratuit)
# Doc : https://render.com/docs/infrastructure-as-code
#
# Usage :
#   1. Pousser ce fichier sur GitHub
#   2. Render Dashboard → New → Blueprint → sélectionner ce dépôt
#   3. Renseigner les variables marquées "sync: false" (secrets)

services:

  # ─── Backend Node.js ──────────────────────────────────────────────────────
  - type: web
    name: logitruck-backend
    runtime: node
    region: frankfurt        # plus proche de l'Afrique de l'Ouest que Oregon
    plan: free               # passe à "starter" ($7/mois) pour éviter le sleep
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3000

      # ── Base de données (injectée automatiquement depuis le service postgres) ──
      - key: DATABASE_URL
        fromDatabase:
          name: logitruck-db
          property: connectionString

      # ── Secrets à renseigner manuellement dans le dashboard Render ──────────
      - key: JWT_SECRET
        sync: false          # à renseigner dans Render Dashboard → Environment

      - key: JWT_EXPIRES_IN
        value: 7d

      # Origines CORS : URLs Vercel de vos 3 frontends (séparées par des virgules)
      # Exemple : https://logitruck-client.vercel.app,https://logitruck-driver.vercel.app,...
      - key: CORS_ORIGIN
        sync: false

      - key: TRUST_PROXY
        value: 1

      - key: PLATFORM_COMMISSION_RATE
        value: "0.10"

      # ── KKiaPay ─────────────────────────────────────────────────────────────
      - key: KKIAPAY_PUBLIC_KEY
        sync: false

      - key: KKIAPAY_PRIVATE_KEY
        sync: false

      - key: KKIAPAY_SECRET
        sync: false

      - key: KKIAPAY_WEBHOOK_SECRET
        sync: false

      # true pour les tests, false en production réelle
      - key: KKIAPAY_SANDBOX
        value: "true"

      # ── Reversement chauffeur ────────────────────────────────────────────────
      - key: PAYOUT_MODE
        value: manual

      # ── OSRM ────────────────────────────────────────────────────────────────
      - key: OSRM_URL
        value: https://router.project-osrm.org

# ─── Base de données PostgreSQL ─────────────────────────────────────────────
databases:
  - name: logitruck-db
    databaseName: logitruck_db
    user: logitruck_user
    region: frankfurt
    plan: free               # 1 Go, 97h/mois actif (suffisant pour les tests)
