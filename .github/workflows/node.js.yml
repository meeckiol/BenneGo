name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: bennego_test
          POSTGRES_USER: bennego_user
          POSTGRES_PASSWORD: bennego_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bennego_user -d bennego_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5433
      DB_NAME: bennego_test
      DB_USER: bennego_user
      DB_PASSWORD: bennego_password
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run migrate
    - run: npm run build -w frontend-client -w frontend-admin -w frontend-driver
    - run: npm test
