name: Flutter

on:
  push:
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [bennego_core, driver, client, admin]
    defaults:
      run:
        working-directory: flutter/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [driver, client, admin]
    defaults:
      run:
        working-directory: flutter/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  # Les runners macOS consomment plus de minutes : le job iOS ne tourne qu'à la demande.
  ios:
    if: github.event_name == 'workflow_dispatch'
    needs: analyze-and-test
    runs-on: macos-latest
    strategy:
      matrix:
        app: [driver, client, admin]
    defaults:
      run:
        working-directory: flutter/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
