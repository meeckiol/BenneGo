# Environnement de développement local. Copiez .env.example en .env et définissez POSTGRES_PASSWORD.
services:
  postgres:
    image: postgres:15-alpine
    container_name: logitruck_postgres
    environment:
      POSTGRES_DB: logitruck_db
      POSTGRES_USER: logitruck_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
    ports:
      - "127.0.0.1:5433:5432"   # accessible uniquement depuis cette machine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: logitruck_adminer
    profiles: ["tools"]          # docker compose --profile tools up -d
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
