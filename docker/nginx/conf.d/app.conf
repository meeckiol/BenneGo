# ──────────────────────────────────────────────────────────────────────────────
# IMPORTANT : remplacer bennego.example.com, driver.bennego.example.com et
#             admin.bennego.example.com par vos vrais domaines.
# ──────────────────────────────────────────────────────────────────────────────

# ─── Redirection HTTP → HTTPS (toutes les requêtes) ──────────────────────────
server {
    listen 80;
    server_name bennego.example.com
                driver.bennego.example.com
                admin.bennego.example.com;

    # Défi ACME pour Let's Encrypt (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Frontend CLIENT  (bennego.example.com) ────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name bennego.example.com;

    ssl_certificate     /etc/letsencrypt/live/bennego.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bennego.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/client;
    index index.html;

    # Headers de sécurité
    # CSP : le JWT est stocké côté navigateur, une faille XSS doit rester contenue.
    include /etc/nginx/conf.d/security-client.inc;

    # Assets statiques — cache long (hash dans le nom de fichier par Vite)
    location /assets/ {
        include /etc/nginx/conf.d/security-client.inc;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Proxy vers le backend (API REST + webhooks KKiaPay)
    # Photos de commande (servies par l'API, noms aléatoires)
    location /uploads/ {
        include /etc/nginx/conf.d/security-client.inc;
        proxy_pass         http://backend:3000;
        proxy_set_header   Host $host;
        expires 1d;
        add_header Cache-Control "private, max-age=86400";
    }

    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # WebSocket Socket.IO (tracking GPS temps réel)
    location /socket.io/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;  # connexions WS longues
    }

    # SPA : toutes les autres routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─── Frontend CHAUFFEUR / PWA  (driver.bennego.example.com) ────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name driver.bennego.example.com;

    ssl_certificate     /etc/letsencrypt/live/bennego.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bennego.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/driver;
    index index.html;

    include /etc/nginx/conf.d/security-driver.inc;

    # Service Worker doit être servi sans cache pour forcer les mises à jour
    location = /sw.js {
        include /etc/nginx/conf.d/security-driver.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /registerSW.js {
        include /etc/nginx/conf.d/security-driver.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/conf.d/security-driver.inc;
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/manifest+json";
    }

    location /assets/ {
        include /etc/nginx/conf.d/security-driver.inc;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Photos de commande (servies par l'API, noms aléatoires)
    location /uploads/ {
        include /etc/nginx/conf.d/security-driver.inc;
        proxy_pass         http://backend:3000;
        proxy_set_header   Host $host;
        expires 1d;
        add_header Cache-Control "private, max-age=86400";
    }

    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /socket.io/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─── Frontend ADMIN  (admin.bennego.example.com) ───────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name admin.bennego.example.com;

    ssl_certificate     /etc/letsencrypt/live/bennego.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bennego.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/admin;
    index index.html;

    # Restriction IP optionnelle : décommentez pour n'autoriser que votre IP
    # allow 1.2.3.4;
    # deny all;

    include /etc/nginx/conf.d/security-admin.inc;

    location /assets/ {
        include /etc/nginx/conf.d/security-admin.inc;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Photos de commande (servies par l'API, noms aléatoires)
